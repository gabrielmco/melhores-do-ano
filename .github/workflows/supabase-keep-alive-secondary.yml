name: Supabase Auto Keep-Alive Camada 3 (Redundancia Secundaria)

on:
  schedule:
    # Executa às 00:00 e 12:00 UTC (alternando com o workflow primário das 06:00 e 18:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  keep-alive-secondary:
    name: Secondary Keep-Alive & Health Ping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Secondary Keep-Alive Diagnostic
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/supabase-keep-alive.mjs
