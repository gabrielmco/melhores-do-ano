name: Supabase Auto Keep-Alive 24/7 (Melhores do Ano)

on:
  schedule:
    # Executa 2 vezes ao dia (06:00 e 18:00 UTC) para garantir que nunca atinja 7 dias de inatividade
    - cron: '0 6,18 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparo manual na aba Actions do GitHub

jobs:
  keep-alive:
    name: Keep Supabase Active & Auto-Restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Supabase Keep-Alive & Diagnostic Engine
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/supabase-keep-alive.mjs
