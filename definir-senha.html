<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir Nova Senha | Melhores do Ano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.scss">
</head>
<body>
  <main class="auth-page-wrapper">
    <div class="card">
      <h2>Definir Nova Senha</h2>
      <p>Digite a nova senha de acesso para sua conta no Melhores do Ano.</p>
      
      <form id="passwordForm">
        <div class="form-group">
          <label for="newPassword">Nova Senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
            <button type="button" class="btn-toggle-password" id="btnToggleNewPassword" data-toggle-password="newPassword" title="Ver senha" aria-label="Ver senha">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span>Ver</span>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar Nova Senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Repita a nova senha" autocomplete="new-password" required minlength="6">
            <button type="button" class="btn-toggle-password" id="btnToggleConfirmPassword" data-toggle-password="confirmPassword" title="Ver senha" aria-label="Ver senha">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span>Ver</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="btnSavePassword">Salvar Nova Senha</button>
      </form>
      
      <div id="statusMessage" class="message"></div>

      <div style="margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 0.84rem;">
        <a href="/candidato.html" style="color: #d4af37; text-decoration: none; font-weight: 600;">Painel do Candidato</a>
        <span style="color: rgba(255,255,255,0.2);">•</span>
        <a href="/admin.html" style="color: rgba(255,255,255,0.65); text-decoration: none;">Painel Admin</a>
      </div>
    </div>
  </main>

  <script type="module" src="/src/js/definirSenha.js"></script>
</body>
</html>
