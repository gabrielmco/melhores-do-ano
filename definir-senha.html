<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir Nova Senha | Melhores do Ano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.scss">
</head>
<body>
  <main class="auth-page-wrapper">
    <div class="card">
    <h2>Definir Nova Senha</h2>
    <p>Digite a senha desejada para a sua conta de administrador abaixo.</p>
    
    <form id="passwordForm">
      <div class="form-group">
        <label for="newPassword">Nova Senha</label>
        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button type="submit" class="btn">Salvar Senha</button>
    </form>
    
    <div id="statusMessage" class="message"></div>
  </div>
  </main>

  <script type="module" src="/src/js/definirSenha.js"></script>
</body>
</html>
